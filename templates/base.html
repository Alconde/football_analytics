<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Football Analytics{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
    <style>
    input, select, textarea {
        width: 100%;
        border-radius: 0.375rem;
        border: 1px solid rgb(51 65 85);
        background: rgb(2 6 23);
        padding: 0.5rem 0.75rem;
        font-size: 0.875rem;
        color: white;
    }
    </style>
  </head>
  <body class="h-full text-slate-100">
    <div class="min-h-full">
      <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
          <a href="{% url 'dashboard' %}" class="text-sm font-semibold tracking-wide text-emerald-400">
            FOOTBALL ANALYTICS
          </a>
          <nav class="flex gap-4 text-sm text-slate-300">
            <a href="{% url 'dashboard' %}" class="hover:text-white">Inicio</a>
            <a href="{% url 'players:list' %}" class="hover:text-white">Jugadores</a>
            <a href="{% url 'matches:list' %}" class="hover:text-white">Partidos</a>
            <a href="{% url 'tactical:list' %}" class="hover:text-white">Informes tácticos</a>
            <a href="{% url 'reports:list' %}" class="hover:text-white">Informes</a>
            {% if user.is_authenticated %}
              <span class="text-slate-500">|</span>
              <span class="text-slate-400">{{ user.get_username }} ({{ user.get_role_display }})</span>
              <form method="post" action="{% url 'logout' %}" class="inline">
                {% csrf_token %}
                <button type="submit" class="text-slate-300 hover:text-white">Salir</button>
              </form>
            {% endif %}
          </nav>
        </div>
      </header>

      <main class="mx-auto max-w-6xl px-4 py-8">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
