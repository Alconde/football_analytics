{% extends "base.html" %}
{% block title %}Entrar · Football Analytics{% endblock %}
{% block content %}
  <div class="mx-auto max-w-md rounded-xl border border-slate-800 bg-slate-900 p-6">
    <h1 class="text-lg font-semibold text-white">Acceso al staff</h1>
    <p class="mt-1 text-sm text-slate-400">Introduce tus credenciales de club.</p>

    {% if form.errors %}
      <p class="mt-3 text-sm text-red-400">Usuario o contraseña incorrectos.</p>
    {% endif %}

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-medium text-slate-400">Usuario</label>
        <input name="username" autofocus class="mt-1 w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-400">Contraseña</label>
        <input type="password" name="password" class="mt-1 w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white" />
      </div>
      <button type="submit" class="w-full rounded-md bg-emerald-500 px-3 py-2 text-sm font-semibold text-slate-950 hover:bg-emerald-400">
        Entrar
      </button>
    </form>
  </div>
{% endblock %}
